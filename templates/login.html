<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ site_name }} — {{ 'Admin Login' if admin_mode else 'Login' }}</title>
<style>
body{font-family:Georgia,'Times New Roman',serif;background:#f5f5f0;margin:0;color:#222}
.box{width:320px;margin:90px auto;background:#fff;border:1px solid #ccc;border-radius:4px;padding:28px 26px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
h1{font-size:22px;margin:0 0 4px;font-weight:normal}.sub{font-size:13px;color:#666;margin:0 0 16px}
label{font-size:13px;display:block;margin:10px 0 3px}input{width:100%;padding:8px;border:1px solid #aaa;border-radius:3px;font-size:14px;box-sizing:border-box}
button{width:100%;margin-top:16px;padding:9px;background:#2c5f8a;color:#fff;border:none;border-radius:3px;font-size:15px;cursor:pointer}button:hover{background:#234e71}
.links{font-size:12px;margin-top:12px;color:#555}.links a{color:#2c5f8a}
#o{font-size:12px;color:#a00;margin-top:8px;white-space:pre-wrap}
.home{text-align:center;margin-top:14px;font-size:12px}
</style></head><body>
<div class="box">
<h1>{{ site_name }}</h1>
<p class="sub">{{ 'Administrator sign in.' if admin_mode else 'Sign in to continue.' }}</p>
<form onsubmit="return login(event)">
<label>Username</label><input id="u" required autocomplete="username">
<label>Password</label><input id="p" type="password" required autocomplete="current-password">
<button>Login</button></form>
<div id="o"></div>
{% if not admin_mode %}<div class="links">New here? <a href="/register">Create account</a><br><a href="/profile">Add API key later</a> — asked only when you generate.</div>{% endif %}
<div class="home"><a href="/">← Back to home</a></div>
</div>
<script>
const next = new URLSearchParams(location.search).get('next') || "{{ '/admin' if admin_mode else '/profile' }}";
async function login(e){e.preventDefault();
const r = await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})});
const j = await r.json();
if(j.ok){location.href = next} else {document.getElementById('o').innerText = JSON.stringify(j)}
return false}
</script></body></html>
