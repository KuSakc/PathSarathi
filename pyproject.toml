[project]
name = "garibi-e-library"
version = "0.1.0"
description = "Syllabus-aware E-Library + content generator (Microprocessor, Discrete Structure + electives)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "alembic>=1.13",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-jose[cryptography]>=3.3",
  "bcrypt>=4.1",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
  "python-dotenv>=1.0",
  "chromadb>=0.5",
  "sentence-transformers>=2.2",
  "pypdf>=4.0",
  "pymupdf>=1.24",
  "reportlab>=4.0",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
